<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16171A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>King — Pontuações</title>
<style>
:root{--ink:#16171A;--paper:#F4F3EF;--roxo:#5E5BB3;--line:#2c2d33;--field:#222328;--pos:#5FD38D;--neg:#FF6B7A;--felt:#1d5a39;--wood:#6b4526}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:640px;padding:12px 12px 90px;font:16px/1.4 system-ui,sans-serif;background:var(--ink);color:var(--paper)}
h1{font-size:1.4rem;margin:0 0 12px}
h2{font-size:1.1rem;margin:24px 0 8px}
button,input{font:inherit;color:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--field)}
button{background:var(--roxo);border:0;cursor:pointer;user-select:none}
button:disabled{opacity:.4}
button.sec{background:var(--line)}
button.big{width:100%;padding:14px;font-size:1.1rem;font-weight:600}
input{width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700;font-size:1.1rem}
tbody tr.edit{cursor:pointer}
tbody tr.sel{background:var(--line)}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.row>button{flex:1}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
small{opacity:.6}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
header .cents{margin-left:auto;flex-direction:row;align-items:center;gap:6px;font-size:.8rem}
header .cents input{width:64px;padding:6px}
/* contratos */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;background:var(--field);border:1px solid var(--line);padding:10px 14px;border-radius:99px}
.chip.on{background:var(--roxo);border-color:var(--roxo);font-weight:600}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.sign button{padding:14px;font-size:1.1rem;font-weight:600;background:var(--field);border:1px solid var(--line)}
.sign .on.p{background:var(--pos);color:var(--ink)}.sign .on.m{background:var(--neg);color:var(--ink)}
/* mesa: jogadores em losango, sentido horário a partir de baixo (S → O → N → E) */
.mesa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;max-width:420px;margin:14px auto}
.s0{grid-area:3/2}.s1{grid-area:2/1}.s2{grid-area:1/2}.s3{grid-area:2/3}
.seat{position:relative}
.feltro{grid-area:2/2;aspect-ratio:1;background:radial-gradient(#2a7a50,var(--felt));border:7px solid var(--wood);border-radius:14px;box-shadow:inset 0 0 12px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.8rem;line-height:1.2;padding:4px}
.feltro big{font-size:2.4rem;font-weight:700;line-height:1.1}
.card{width:100%;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--paper);color:var(--ink);border:0;border-top:7px solid var(--c);border-radius:10px;padding:6px 4px;box-shadow:0 3px 8px #0007;text-align:center}
.card:disabled{opacity:1}
.card .pos{color:#1d8a4b}.card .neg{color:#c8243d}
.card input{background:#fff;color:var(--ink);border-color:#ccc;padding:8px;text-align:center}
.hit:not(:disabled):active{transform:scale(.95)}
.card .n{font-size:2rem;font-weight:700;line-height:1}
.card .eur{font-size:.85rem;font-weight:700}
.card.pick{outline:4px solid #FFD400}
.minus{position:absolute;top:-10px;right:-6px;width:36px;height:36px;border-radius:50%;padding:0;background:var(--ink);border:2px solid var(--c);font-size:1.2rem}
.minus:disabled{display:none}
.tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--ink);color:var(--paper)}
.tag.d{background:#FFD400;color:var(--ink)}
.da{flex-direction:row;align-items:center;gap:4px;font-size:.8rem;margin-top:4px}
.da input{width:auto}
details{border-bottom:1px solid var(--line);padding:8px 0}
summary{cursor:pointer}
/* gráfico */
.chart{margin:8px 0 16px}
.chart svg{width:100%;height:auto;background:var(--field);border-radius:8px}
.chart polyline{fill:none;stroke-width:2.5;stroke-linejoin:round}
.chart .zero{stroke:#fff6}.chart .sep{stroke:#fff3;stroke-dasharray:3 3}
.chart text{fill:#fffa;font-size:10px}
figcaption{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.85rem;margin-top:6px}
/* navegação e aviso */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e0f11;border-top:1px solid var(--line)}
nav button{flex:1;background:none;border-radius:0;padding:16px;font-weight:600;opacity:.55}
nav button.on{opacity:1;box-shadow:inset 0 3px var(--roxo)}
.toast{position:fixed;left:12px;right:12px;bottom:72px;max-width:616px;margin:auto;background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px #000a}
.toast button{color:var(--paper)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const NEG = {
  vazas:   {n: 'Vazas',        v: -20,  t: 13},
  copas:   {n: 'Copas',        v: -20,  t: 13},
  damas:   {n: 'Damas',        v: -50,  t: 4},
  homens:  {n: 'Homens',       v: -30,  t: 8},
  rei:     {n: 'Rei de copas', v: -160, t: 1},
  ultimas: {n: '2 últimas',    v: -90,  t: 2},
};
const ORDER = [...Object.keys(NEG), 'festa'];
const COL = ['#00AEEF', '#EC198B', '#FFD400', '#9D9AF0']; // cor de cada lugar
// Festas: 13 vazas. Positiva +25 por vaza; negativa começa em 325 e perde 75 por vaza.
const total = c => c === 'festa' ? 13 : NEG[c].t;
const pts = h => h.counts.map(n =>
  h.c !== 'festa' ? n * NEG[h.c].v : h.pos ? 25 * n : 325 - 75 * n);
const totals = g => g.hands.reduce((t, h) => pts(h).map((x, j) => t[j] + x), [0, 0, 0, 0]);
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const tone = x => x < 0 ? 'neg' : x > 0 ? 'pos' : '';
const td = (x, txt) => `<td class="${tone(x)}">${txt}</td>`;
const cell = x => td(x, x);
const money = x => x.toLocaleString('pt-PT', {style: 'currency', currency: 'EUR'});
// Jogadores pela ordem do sentido horário; quem dá na mão i roda a partir de g.first.
const dealer = (g, i) => ((g.first || 0) + i) % 4;
// A festa é de quem dá nessa mão.
const label = (g, h, i) => h.c === 'festa'
  ? `Festa ${h.pos ? '+' : '−'} ${esc(g.players[dealer(g, i)])}` : NEG[h.c].n;

console.assert(pts({c: 'rei', counts: [0, 1, 0, 0]}).join() === '0,-160,0,0');
console.assert(pts({c: 'festa', pos: false, counts: [13, 0, 0, 0]}).join() === '-650,325,325,325');
console.assert(pts({c: 'festa', pos: true, counts: [5, 4, 3, 1]}).join() === '125,100,75,25');

let S;
try { S = JSON.parse(localStorage.king); } catch {}
S ||= {cur: null, hist: []};
// Jornada = 4 partidas. Dados antigos (uma partida solta) passam a jornada de 1 partida.
const asJornada = j => j && (j.games ? j : {date: j.date, players: j.players, games: [j]});
S.cur = asJornada(S.cur); S.hist = S.hist.map(asJornada);
[S.cur, ...S.hist].forEach(j => { if (j?.eur) { j.cents = Math.round(j.eur * 1e4) / 100; delete j.eur; } });
const save = () => localStorage.king = JSON.stringify(S);
const G = () => S.cur.games.at(-1); // partida atual
const jTotals = j => j.games.map(totals).reduce((t, x) => t.map((v, k) => v + x[k]));
// Valor por ponto em cêntimos; mostra euros se estiver definido.
const val = (J, x) => J.cents ? money(x * J.cents / 100) : `${x} pts`;
const eurRow = (J, txt) => J.cents ? `<tr><td>${txt}</td>${jTotals(J).map(x => td(x, val(J, x))).join('')}</tr>` : '';

// Estado da mão a ser contada.
let tab = 'jogo', edit = null, con = null, pos = null, cnt = [0, 0, 0, 0], nextFirst = null, toast = null, toastTimer;

function avail() {
  const used = G().hands.filter((_, i) => i !== edit);
  return ORDER.filter(c => c === 'festa'
    ? used.filter(x => x.c === 'festa').length < 4 : !used.some(x => x.c === c));
}
function resetHand() { edit = null; pos = null; cnt = [0, 0, 0, 0]; con = S.cur ? avail()[0] ?? null : null; }
const rem = () => total(con) - cnt.reduce((a, b) => a + b, 0);

function render() {
  document.getElementById('app').innerHTML = (tab === 'hist' ? histTab() : S.cur ? jogo() : setup())
    + `<nav><button class="${tab === 'jogo' ? 'on' : ''}" onclick="tab='jogo';render()">♠ Jogo</button>
       <button class="${tab === 'hist' ? 'on' : ''}" onclick="tab='hist';render()">📈 Histórico</button></nav>`
    + (toast ? `<div class="toast">${toast.msg}<button onclick="undo()">Desfazer</button></div>` : '');
}

const mesa = (seat, center = '') => `<div class="mesa">${[0, 1, 2, 3].map(j =>
  `<div class="seat s${j}">${seat(j)}</div>`).join('')}<div class="feltro">${center}</div></div>`;

function setup() {
  const last = S.hist[0] || {};
  return `<h1>Nova jornada</h1>
  <form onsubmit="start(event)">${mesa(j => `<div class="card" style="--c:${COL[j]}">
    <input name="p" required placeholder="Jogador ${j + 1}" value="${esc(last.players?.[j] || '')}">
    <label class="da"><input type="radio" name="d" value="${j}" ${j ? '' : 'checked'}> dá</label></div>`, 'sentido<br>horário<big>↻</big>')}
  <label>Valor por ponto (cêntimos)<input name="cents" type="number" inputmode="decimal" step="any" min="0" required
    placeholder="ex.: 1" value="${last.cents ?? ''}"></label>
  <div class="row"><button class="big">Começar jornada</button></div></form>`;
}

function start(e) {
  e.preventDefault();
  const f = e.target, players = [...f.p].map(i => i.value.trim());
  S.cur = {date: Date.now(), players, cents: +f.cents.value, games: [{players, first: +f.d.value, hands: []}]};
  save(); resetHand(); render();
}

function jogo() {
  const J = S.cur, g = G(), k = J.games.length, n = g.hands.length;
  const done = n === 10 && edit === null, i = edit ?? n, d = dealer(g, i);
  const acc = jTotals(J), nf = nextFirst ?? (g.first + 1) % 4, r = con ? rem() : 0;
  const festa = con === 'festa', counting = !done && con && (festa ? pos !== null : r > 0);
  const seat = j => done
    ? `<button class="card ${k < 4 && j === nf ? 'pick' : ''}" style="--c:${COL[j]}" ${k < 4 ? `onclick="nextFirst=${j};render()"` : 'disabled'}>
        <b>${esc(J.players[j])}</b>${k < 4 && j === nf ? '<span class="tag d">dá</span>' : ''}
        <span class="eur ${tone(acc[j])}">${val(J, acc[j])}</span></button>`
    : `<button class="card hit" style="--c:${COL[j]}" onclick="tap(${j},1)" ${counting ? '' : 'disabled'}>
        <b>${esc(J.players[j])}</b>${j === d ? '<span class="tag d">dá</span>' : j === (d + 1) % 4 ? '<span class="tag">joga 1º</span>' : ''}
        <span class="n">${cnt[j]}</span><span class="eur ${tone(acc[j])}">${val(J, acc[j])}</span></button>
       <button class="minus" style="--c:${COL[j]}" onclick="tap(${j},-1)" ${cnt[j] || (festa && counting) ? '' : 'disabled'}>−</button>`;
  const center = done ? (k < 4 ? `Toca em quem dá a partida ${k + 1}` : 'Jornada terminada')
    : con === 'festa' && pos === null ? 'Positiva ou negativa?'
    : festa ? `Festa<big>${13 - r}</big>vazas contadas`
    : `${NEG[con].n}<big>${r}</big>${r === 1 ? 'falta' : 'faltam'}`;
  return `<header><b>Partida ${k}/4</b><span>${done ? '· terminada' : edit !== null ? `· a corrigir mão ${i + 1}` : `· mão ${n + 1}/10`}</span>
    <label class="cents">cênt./ponto<input type="number" inputmode="decimal" step="any" min="0" value="${J.cents ?? ''}"
      onchange="S.cur.cents = +this.value; save(); render()"></label></header>
  ${done ? '' : `<div class="chips">${avail().map(c => `<button class="chip ${c === con ? 'on' : ''}" onclick="pick('${c}')">${
    c === 'festa' ? `Festa ${esc(g.players[d])}` : NEG[c].n}</button>`).join('')}</div>`}
  ${!done && con === 'festa' ? `<div class="sign">
    <button class="p ${pos === true ? 'on' : ''}" onclick="pickPos(true)">+ Positiva</button>
    <button class="m ${pos === false ? 'on' : ''}" onclick="pickPos(false)">− Negativa</button></div>` : ''}
  ${mesa(seat, center)}
  ${festa && counting ? '<div class="row"><button class="big" onclick="commit()">Gravar festa</button></div>' : ''}
  ${done ? `<div class="row"><button class="big" onclick="${k < 4 ? 'startNext()' : 'finish()'}">${
    k < 4 ? `Começar partida ${k + 1}` : 'Terminar jornada e guardar'}</button></div>` : ''}
  ${edit !== null ? `<div class="row"><button class="sec" onclick="del()">Apagar mão</button>
    <button class="sec" onclick="resetHand(); render()">Cancelar</button></div>` : ''}
  ${table(g, true)}
  <p><small>Toca numa mão da tabela para a corrigir.</small></p>
  <div class="row"><button class="sec" onclick="abandon()">Abandonar jornada</button></div>`;
}

function pick(c) {
  const h = edit !== null && G().hands[edit];
  con = c;
  if (h && h.c === c) { cnt = [...h.counts]; pos = h.pos ?? null; } else { cnt = [0, 0, 0, 0]; pos = null; }
  render();
}
function pickPos(p) { pos = p; if (rem() === 0) commit(); else render(); }

function tap(j, dl) {
  // Festas: contagem livre (o leilão pode dar mais de 13 ou vazas negativas); grava sozinha quando a soma dá 13.
  if (con === 'festa') { cnt[j] += dl; return rem() === 0 ? commit() : render(); }
  if (dl > 0 && rem() <= 0) return;
  cnt[j] = Math.max(0, cnt[j] + dl);
  if (dl > 0 && rem() === 0) commit(); else render();
}

// Grava sozinha quando a contagem fecha; o aviso permite desfazer.
function commit() {
  if (con === 'festa' && pos === null) return render();
  const g = G(), i = edit ?? g.hands.length, h = {c: con, counts: [...cnt]};
  if (con === 'festa') h.pos = pos;
  const snap = {before: JSON.stringify(g.hands), edit, con, pos, cnt: [...cnt]};
  g.hands[i] = h;
  save(); resetHand();
  toast = {msg: `Mão ${i + 1} gravada`, snap};
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast = null; render(); }, 5000);
  render();
}
function undo() {
  const s = toast.snap;
  G().hands = JSON.parse(s.before);
  ({edit, con, pos} = s); cnt = s.cnt; toast = null;
  save(); render();
}

function startEdit(i) {
  const h = G().hands[i];
  edit = i; con = h.c; cnt = [...h.counts]; pos = h.c === 'festa' ? h.pos : null;
  render(); scrollTo(0, 0);
}
function del() { if (confirm('Apagar esta mão?')) { G().hands.splice(edit, 1); save(); resetHand(); render(); } }
function startNext() {
  const g = G();
  S.cur.games.push({players: S.cur.players, first: nextFirst ?? (g.first + 1) % 4, hands: []});
  nextFirst = null; save(); resetHand(); render(); scrollTo(0, 0);
}
function finish() { S.hist.unshift(S.cur); S.cur = null; save(); resetHand(); tab = 'hist'; render(); }
function abandon() { if (confirm('Abandonar a jornada atual sem guardar?')) { S.cur = null; save(); resetHand(); render(); } }

const head = players => `<thead><tr><th></th>${players.map((p, j) => `<th style="color:${COL[j]}">${esc(p)}</th>`).join('')}</tr></thead>`;

function table(g, editable) {
  return `<table>${head(g.players)}
  <tbody>${g.hands.map((h, i) => `<tr ${editable ? `class="edit ${i === edit ? 'sel' : ''}" onclick="startEdit(${i})"` : ''}>
    <td>${i + 1}. ${label(g, h, i)}<br><small>${esc(g.players[dealer(g, i)])} deu</small></td>${pts(h).map(cell).join('')}</tr>`).join('')}</tbody>
  <tfoot><tr><td>Total</td>${totals(g).map(cell).join('')}</tr></tfoot></table>`;
}

function jTable(j) {
  return `<table>${head(j.players)}
  <tbody>${j.games.map((g, i) => `<tr><td>Partida ${i + 1}<br><small>${esc(j.players[g.first || 0])} deu primeiro</small></td>${totals(g).map(cell).join('')}</tr>`).join('')}</tbody>
  <tfoot><tr><td>Jornada</td>${jTotals(j).map(cell).join('')}</tr>${eurRow(j, 'Valor')}</tfoot></table>`;
}

// Evolução dos pontos acumulados, mão a mão, ao longo da jornada.
function chart(J) {
  const acc = [0, 0, 0, 0], series = [[0], [0], [0], [0]];
  J.games.forEach(g => g.hands.forEach(h => pts(h).forEach((v, j) => series[j].push(acc[j] += v))));
  const n = series[0].length - 1;
  if (!n) return '';
  const all = series.flat(), lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const W = 360, H = 200, P = 10, L = 42;
  const X = i => L + i * (W - L - P) / n, Y = v => P + (hi - v) * (H - 2 * P) / ((hi - lo) || 1);
  return `<figure class="chart"><svg viewBox="0 0 ${W} ${H}">
    ${[10, 20, 30].filter(i => i < n).map(i => `<line class="sep" x1="${X(i)}" x2="${X(i)}" y1="${P}" y2="${H - P}"/>`).join('')}
    <line class="zero" x1="${L}" x2="${W - P}" y1="${Y(0)}" y2="${Y(0)}"/>
    <text x="${L - 6}" y="${Y(hi) + 4}" text-anchor="end">${hi}</text>
    <text x="${L - 6}" y="${Y(0) + 4}" text-anchor="end">0</text>
    <text x="${L - 6}" y="${Y(lo) + 4}" text-anchor="end">${lo}</text>
    ${series.map((s, j) => `<polyline stroke="${COL[j]}" points="${s.map((v, i) => `${X(i)},${Y(v)}`).join(' ')}"/>`).join('')}
  </svg><figcaption>${J.players.map((p, j) => `<span style="color:${COL[j]}">● ${esc(p)}</span>`).join('')}</figcaption></figure>`;
}

function histTab() {
  const body = J => `${chart(J)}${jTable(J)}${J.games.map((g, i) =>
    `<details><summary>Partida ${i + 1}</summary>${table(g, false)}</details>`).join('')}`;
  return `<h1>Histórico</h1>
  ${S.cur ? `<h2>Jornada atual</h2>${body(S.cur)}` : ''}
  ${S.hist.length ? '<h2>Jornadas anteriores</h2>' : ''}
  ${S.hist.map(J => {
    const t = jTotals(J), m = Math.max(...t);
    return `<details><summary>${new Date(J.date).toLocaleDateString('pt-PT')} — ${J.players.map((p, j) =>
      `${t[j] === m ? '👑 ' : ''}${esc(p)} ${val(J, t[j])}`).join(' · ')}</summary>${body(J)}</details>`;
  }).join('')}
  ${!S.cur && !S.hist.length ? '<p>Ainda não há jornadas.</p>' : ''}`;
}

// O ecrã não se apaga durante o jogo.
const wake = () => navigator.wakeLock?.request('screen').catch(() => {});
wake(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake());

resetHand();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
